# AI.fred design-and-planning publication.
# Static HTML only: no build command, no framework, no CDN. Netlify serves docs/ straight from GitHub.

[build]
  publish = "docs"

# Interim access mitigation (BUILD_BRIEF.md section 1.11, open item in 07): keep the site out of search indexes
# until access control is resolved. Pages also carry a no-index meta directive.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
