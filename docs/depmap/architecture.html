<style>
@font-face { font-family: "Inter"; font-weight: 100 900; font-style: normal; font-display: swap; src: url("../assets/fonts/inter-latin-wght-normal.woff2") format("woff2-variations"); }

<style>

   an open item pink; the accent is reserved for selection. */
:root {
  color-scheme: light;
  --paper: #fbfaf7; --paper-2: #f3f1ea; --ink: #17150e; --ink-soft: #4f4b40; --muted: #8a8578; --line: #d8d4c8;

  --sans: "Inter", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}

  :root:not([data-theme="light"]) {
    color-scheme: dark;

    --accent: #e86a4c; --panel: rgba(21, 20, 15, 0.92); --pill: rgba(21, 20, 15, 0.88);
    --node-stroke: rgba(241, 238, 230, 0.35); --edge: 241, 238, 230; --guide: rgba(241, 238, 230, 0.14); --zone: rgba(241, 238, 230, 0.035);

    --up: #e86a4c; --down: #f1eee6; --lat: #d55181;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #15140f; --paper-2: #1f1d17; --ink: #f1eee6; --ink-soft: #b8b2a4; --muted: #7f7a6d; --line: #3a3730;
  --accent: #e86a4c; --panel: rgba(21, 20, 15, 0.92); --pill: rgba(21, 20, 15, 0.88);

  --up: #e86a4c; --down: #f1eee6; --lat: #d55181;

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font: 14px/1.45 var(--sans); overflow: hidden; }
button, input { font: inherit; color: inherit; }
button { background: var(--paper-2); border: 1px solid var(--line); border-radius: 4px; padding: 5px 10px; cursor: pointer; }
button:hover { border-color: var(--ink-soft); }
.back { margin-left: 12px; font-size: 12px; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; white-space: nowrap; }
.back:hover { color: var(--ink); }
button:focus-visible, input:focus-visible, .row:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:disabled { opacity: 0.45; cursor: default; }

.app { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); z-index: 3; }
.brand { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
.brand .mark { font-weight: 600; font-size: 16px; letter-spacing: 0.01em; }
.brand .sub { color: var(--ink-soft); font-size: 12.5px; }
.search { position: relative; flex: 1 1 220px; max-width: 360px; }
.search input { width: 100%; padding: 6px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--paper); }
.results { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; max-height: 320px; overflow: auto; z-index: 5; }
.results button { display: flex; width: 100%; gap: 8px; align-items: center; text-align: left; border: 0; border-radius: 0; background: transparent; padding: 7px 10px; }
.results button:hover, .results button.active { background: var(--paper-2); }
.results .id { font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin-left: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 7px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); font-size: 12.5px; }
.chip[aria-pressed="false"] { opacity: 0.45; }
.chip[aria-pressed="true"] { background: var(--paper); color: var(--ink); border-color: var(--line); }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
.tools { display: flex; gap: 6px; margin-left: auto; }

.stage-wrap { position: relative; overflow: hidden; }
canvas#stage { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
canvas#stage.grabbing { cursor: grabbing; }
canvas#stage.pointing { cursor: pointer; }
.glyph { width: 16px; height: 16px; flex: none; display: inline-block; vertical-align: middle; }

.legend { position: absolute; left: 16px; bottom: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; font-size: 12.5px; max-width: 262px; z-index: 2; }
.legend-toggle { display: none; }
.legend h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 6px; font-weight: 500; }
.legend .lrows + h2 { margin-top: 10px; }
.lrows { display: grid; gap: 3px; }
.lrow { display: flex; align-items: center; gap: 8px; }
.lrow canvas { width: 16px; height: 16px; flex: none; cursor: default; }
.lrow button { border: 0; background: transparent; color: var(--ink); padding: 0; text-align: left; display: flex; align-items: center; gap: 8px; }
.lrow button[aria-pressed="false"] { opacity: 0.4; text-decoration: line-through; }
.lrow .k { color: var(--ink-soft); }
.fatals { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.fatals button { font-size: 12px; padding: 3px 8px; }
.alt-note { color: var(--muted); font-size: 11.5px; margin: 6px 0 0; }
.hint { position: absolute; right: 16px; bottom: 16px; margin: 0; color: var(--muted); font-size: 12px; max-width: 340px; text-align: right; z-index: 2; }

.inspector { position: absolute; top: 12px; right: 12px; bottom: 12px; width: 350px; max-width: calc(100% - 24px); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; display: flex; flex-direction: column; z-index: 4; overflow: hidden; }
.inspector[hidden] { display: none; }
.ihead { display: flex; align-items: flex-start; gap: 8px; padding: 12px 12px 8px; border-bottom: 1px solid var(--line); }
.ihead .kind { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); }
.ihead h2 { font-size: 16px; line-height: 1.3; margin: 4px 0 2px; font-weight: 600; text-wrap: balance; }
.ihead .id { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.ihead .close { margin-left: auto; padding: 2px 8px; }
.facets { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.facets span { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); border: 1px solid var(--line); border-radius: 3px; padding: 1px 5px; }
.trail { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 12px; }
.trail:empty { display: none; }
.trail button { padding: 1px 7px; font-size: 12px; border-radius: 999px; }
.trail button.here { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.ibody { overflow: auto; padding: 4px 0 12px; }
.grp { padding: 8px 12px 2px; }
.grp h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 4px; font-weight: 500; display: flex; align-items: baseline; gap: 8px; }
.grp h3 .n { font-family: var(--mono); letter-spacing: 0; color: var(--ink-soft); }
.grp h3 .dir { display: inline-block; width: 10px; height: 3px; border-radius: 2px; }
.rows { display: grid; gap: 1px; }
.row { display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent; padding: 5px 4px; border-radius: 4px; }
.row:hover { background: var(--paper-2); }
.row .lbl { line-height: 1.3; }
.row .via { font-family: var(--mono); font-size: 10.5px; color: var(--muted); white-space: nowrap; }
.reopens { padding: 8px 12px; margin: 0 12px; background: var(--paper-2); border-radius: 4px; font-size: 12.5px; }
.reopens b { font-weight: 600; }
.reopens ul { margin: 4px 0 0; padding-left: 16px; }
.reopens li { margin: 1px 0; }
.reopens .id { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.loci { list-style: none; padding: 0 12px; margin: 0; font-size: 12.5px; display: grid; gap: 4px; }
.loci li { display: grid; grid-template-columns: 66px 1fr; gap: 8px; align-items: baseline; }
.loci .role { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.loci a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 2px; }
.loci a:hover { text-decoration-color: var(--ink); }
.loci .at { font-family: var(--mono); font-size: 10.5px; color: var(--muted); display: block; overflow-wrap: anywhere; }
.note { padding: 6px 12px 0; font-size: 12.5px; color: var(--ink-soft); }
.empty { padding: 4px 12px; color: var(--muted); font-size: 12.5px; }

@media (max-width: 720px) {
  .bar { gap: 8px 12px; }
  .brand .sub { display: none; }
  .tools { margin-left: 0; }
  .inspector { top: auto; left: 12px; right: 12px; bottom: 12px; width: auto; max-width: none; max-height: 48vh; }
  .legend { display: none; bottom: auto; top: 12px; max-width: 240px; max-height: calc(100% - 24px); overflow: auto; font-size: 11.5px; }
  .legend.open { display: block; }
  .legend-toggle { display: inline-block; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

  push(allOf, ed.a.id, { n: ed.b, ed }); push(allOf, ed.b.id, { n: ed.a, ed });

  else { push(latOf, ed.a.id, { n: ed.b, ed }); push(latOf, ed.b.id, { n: ed.a, ed }); }
}
const count = (k) => nodes.filter((n) => n.kind === k).length;
document.getElementById('sub').textContent = `Architecture map, edition ${DATA.edition}: ${count('comp')} components, ${count('inv')} invariants, ${count('vocab') + count('flag')} lists and flag rows, ${count('dr')} records`;

// The stage that builds a component: the lowest-numbered stage that depends on it.
const stageNo = new Map();
for (const ed of edges) if (ed.kind === 'depends-on' && ed.a.kind === 'stage' && ed.b.kind === 'comp') {
  const n = Number(ed.a.id.split('-')[1]);
  if (!stageNo.has(ed.b.id) || n < stageNo.get(ed.b.id)) stageNo.set(ed.b.id, n);
}
function shortLabel(n) {

  return s.charAt(0).toUpperCase() + s.slice(1);
}

// ----------------------------------------------------------------- layout: the zones of Figure 2.1, bands above and below
const zones = ZONES.map((z) => ({ ...z, comps: [] }));
const Z = Object.fromEntries(zones.map((z) => [z.id, z]));
for (const n of nodes) if (n.kind === 'comp') (Z[n.facets.zone] || Z.cross).comps.push(n);
for (const z of zones) {
  z.comps.sort((a, b) => (stageNo.get(a.id) ?? 99) - (stageNo.get(b.id) ?? 99) || a.label.localeCompare(b.label));
  z.cols = Math.max(1, Math.min(z.cols, z.comps.length));
  z.rows = Math.max(1, Math.ceil(z.comps.length / z.cols));
  z.w = z.cols * BOX.w + (z.cols - 1) * GAP + 2 * PAD;
  z.h = z.rows * BOX.h + (z.rows - 1) * GAP + TITLE + 2 * PAD;
}

Z.entry.x = X0; Z.entry.y = 0; Z.entry.w = Z.alias.w + ZGAP + Z['real-value'].w;
Z.alias.x = X0; Z.alias.y = Z.entry.h + ZGAP;
Z['real-value'].x = Z.alias.x + Z.alias.w + ZGAP; Z['real-value'].y = Z.alias.y;
Z.market.x = Z['real-value'].x + Z['real-value'].w + ZGAP; Z.market.y = Z.alias.y;
const rowBottom = Math.max(Z.alias.y + Z.alias.h, Z['real-value'].y + Z['real-value'].h, Z.market.y + Z.market.h);
Z.floor.x = X0; Z.floor.y = rowBottom + ZGAP;
Z.cross.x = Z.floor.x + Z.floor.w + ZGAP; Z.cross.y = Z.floor.y;
Z.device.x = 0; Z.device.y = Z.alias.y + Math.max(0, (Z.alias.h - Z.device.h) / 2);

const fieldBottom = Math.max(Z.floor.y + (Z.floor.comps.length ? Z.floor.h : 0), Z.cross.y + (Z.cross.comps.length ? Z.cross.h : 0), rowBottom);
function slot(z, i) {
  const gridW = z.cols * BOX.w + (z.cols - 1) * GAP;
  const left = z.x + (z.w - gridW) / 2;
  const col = i % z.cols, row = Math.floor(i / z.cols);
  return { x: left + col * (BOX.w + GAP) + BOX.w / 2, y: z.y + TITLE + PAD + row * (BOX.h + GAP) + BOX.h / 2 };

// so the wiring between zones runs as straight as a grid allows. Ties keep the build order.
const compNeighbours = (n) => (allOf.get(n.id) || []).filter((x) => x.ed.kind === 'depends-on' && x.n.kind === 'comp').map((x) => x.n);
for (let sweep = 0; sweep < 2; sweep++) for (const z of zones) {
  if (z.comps.length < 3) continue;
  const key = new Map();
  for (const n of z.comps) { const xs = compNeighbours(n).filter((m) => (Z[m.facets.zone] || Z.cross) !== z).map((m) => m.x); key.set(n.id, xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : n.x); }
  const order = [...z.comps].sort((a, b) => key.get(a.id) - key.get(b.id) || (stageNo.get(a.id) ?? 99) - (stageNo.get(b.id) ?? 99) || a.label.localeCompare(b.label));

  const slots = [];
  for (let c = 0; c < z.cols; c++) for (let r = 0; r < z.rows; r++) if (r * z.cols + c < z.comps.length) slots.push(r * z.cols + c);

  order.forEach((n, i) => { z.comps[slots[i]] = n; });

}

function orderBand(list) {
  const key = new Map();
  for (const n of list) {
    const xs = (allOf.get(n.id) || []).filter((x) => placed.has(x.n.id)).map((x) => x.n.x);
    key.set(n.id, xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : Infinity);

  list.sort((a, b) => { const d = key.get(a.id) - key.get(b.id); return Number.isNaN(d) || d === 0 ? a.id.localeCompare(b.id) : d; });
}
function spread(list, y) {
  const left = fieldLeft + 30, width = fieldRight - fieldLeft - 60;
  list.forEach((n, i) => { n.x = left + (i + 0.5) * width / list.length; n.y = y; placed.add(n.id); });

const bandList = [
  { key: 'list',  kinds: ['vocab', 'flag'], y: fieldTop - 96,  label: 'closed lists and policy flag rows: what the harness reads' },

for (const b of bandList) {

  if (b.key === 'stage') list.sort((a, c) => Number(a.id.split('-')[1]) - Number(c.id.split('-')[1]));

const badges = [];

  for (const t of targets) { const i = badgeCount.get(t.id) || 0; badgeCount.set(t.id, i + 1); badges.push({ n, t, i }); }

}

  const st = stageNo.get(n.id);
  if (n.kind === 'comp' && st) facets.stage = String(st);
  ihead.append(
    el('div', null,
      el('span', { class: 'kind' }, glyph(n.kind), n.k.name),
      el('h2', null, n.kind === 'dr' ? `${n.id.toUpperCase()} ${n.label}` : n.label),
      el('span', { class: 'id' }, n.id),
      Object.keys(facets).length ? el('div', { class: 'facets' }, ...Object.entries(facets).map(([k, v]) => el('span', null, `${k}: ${v}`))) : null),
    el('button', { class: 'close', type: 'button', 'aria-label': 'Clear the selection', onclick: () => select(null) }, '×'));
  for (const id of trail) trailEl.append(el('button', { type: 'button', class: id === n.id ? 'here' : '', onclick: () => select(byId.get(id), { push: false, flyTo: true }) }, byId.get(id).kind === 'dr' ? id.toUpperCase() : (byId.get(id).kind === 'comp' ? shortLabel(byId.get(id)) : byId.get(id).label).slice(0, 26)));
  const reopen = [...cone.up].map((id) => byId.get(id)).filter((m) => m.kind === 'dr').sort((a, b) => cone.dist.get(a.id) - cone.dist.get(b.id));
  if (n.kind === 'dr' || reopen.length) {
    const items = [n.kind === 'dr' ? n : null, ...reopen].filter(Boolean).slice(0, 8);
    ibody.append(el('div', { class: 'reopens' }, el('b', null, 'A change here reopens'), el('ul', null, ...items.map((m) => el('li', null, el('span', { class: 'id' }, m.id.toUpperCase()), ' ', m.label))), reopen.length > 7 ? el('div', { class: 'id' }, `and ${reopen.length - 7} more upstream`) : null));
  }
  const groups = new Map();
  for (const ed of edges) {
    let dir = null;
    if (ed.a === n) dir = 'out'; else if (ed.b === n) dir = 'in'; else continue;
    const other = dir === 'out' ? ed.b : ed.a;
    if (hiddenKinds.has(other.kind)) continue;
    const [title, tok] = titleFor(n, ed, dir);
    if (!groups.has(title)) groups.set(title, { tok, rows: [] });
    groups.get(title).rows.push(rowFor(other, other.kind === 'comp' && stageNo.get(other.id) ? `S${stageNo.get(other.id)}` : other.kind === 'stage' ? '' : ed.kind));
  }
  const titles = [...groups.keys()].sort((a, b) => (ORDER.indexOf(a) + 1 || 99) - (ORDER.indexOf(b) + 1 || 99));
  for (const t of titles) { const g = groups.get(t); ibody.append(el('div', { class: 'grp' }, el('h3', null, el('span', { class: 'dir', style: `background:${tokens[g.tok] || tokens['--ink-soft']}` }), t, el('span', { class: 'n' }, String(g.rows.length))), el('div', { class: 'rows' }, ...g.rows))); }
  if (!titles.length) ibody.append(el('p', { class: 'empty' }, 'No edge touches this node.'));
  const far = [...cone.down].map((id) => byId.get(id)).filter((m) => cone.dist.get(m.id) === 2);
  if (far.length) ibody.append(el('div', { class: 'grp' }, el('h3', null, el('span', { class: 'dir', style: `background:${tokens['--down']}` }), 'Two steps downstream', el('span', { class: 'n' }, String(far.length))), el('div', { class: 'rows' }, ...far.slice(0, 40).map((m) => rowFor(m, 'via ' + m.kind)))));
  if (n.note) ibody.append(el('p', { class: 'note' }, n.note));
  if (n.source) ibody.append(el('p', { class: 'note' }, n.source));
  if (n.loci.length) ibody.append(el('div', { class: 'grp' }, el('h3', null, 'Where the pages state it'), el('ul', { class: 'loci' }, ...n.loci.map((l) => el('li', null, el('span', { class: 'role' }, l.role), el('span', null, l.href ? el('a', { href: l.href }, l.text || l.at) : (l.text || l.at), el('span', { class: 'at' }, l.at)))))));
}

// ----------------------------------------------------------------- chips, legend, search, buttons
const chips = document.getElementById('kind-chips');
readTokens();
for (const [g, def] of Object.entries(GROUP)) {
  const b = el('button', { class: 'chip', type: 'button', 'aria-pressed': 'true', title: def.name, onclick: () => {
    const on = b.getAttribute('aria-pressed') === 'true';
    b.setAttribute('aria-pressed', on ? 'false' : 'true');
    for (const k of def.kinds) on ? hiddenKinds.add(k) : hiddenKinds.delete(k);
    if (selected && hiddenKinds.has(selected.kind)) select(null); else if (selected) select(selected, { push: false });
    invalidate();
  } }, el('span', { class: 'sw', style: `background:${tokens[def.tok]}` }), def.kinds.map((k) => KIND[k].name).join(', '));
  chips.append(b);
}
const legend = document.getElementById('legend');
const btnFatal = {};
function buildLegend() {
  readTokens();
  legend.replaceChildren(el('h2', null, 'Nodes'));
  const rows = el('div', { class: 'lrows' });
  for (const [g, def] of Object.entries(GROUP)) for (const k of def.kinds) rows.append(el('div', { class: 'lrow' }, glyph(k), el('span', null, KIND[k].name, ' ', el('span', { class: 'k' }, `(${nodes.filter((n) => n.kind === k).length})`))));
  legend.append(rows, el('h2', null, 'Edges (click to hide)'));
  const erows = el('div', { class: 'lrows' });
  for (const [kind, def] of Object.entries(EDGE)) {
    const cv = el('canvas', { class: 'glyph', width: 16, height: 16, 'aria-hidden': 'true' }); const c = cv.getContext('2d'); cv.width = 16 * dpr; cv.height = 16 * dpr; c.scale(dpr, dpr);
    c.strokeStyle = tokens['--ink']; c.fillStyle = tokens['--ink']; c.lineWidth = def.w + 0.4; c.setLineDash(def.dash); c.beginPath(); c.moveTo(1, 8); c.lineTo(15, 8); c.stroke();
    if (def.arrow) { c.setLineDash([]); c.beginPath(); c.moveTo(15, 8); c.lineTo(10, 5.5); c.lineTo(10, 10.5); c.closePath(); c.fill(); }
    const b = el('button', { type: 'button', 'aria-pressed': hiddenEdges.has(kind) ? 'false' : 'true', onclick: () => { hiddenEdges.has(kind) ? hiddenEdges.delete(kind) : hiddenEdges.add(kind); b.setAttribute('aria-pressed', hiddenEdges.has(kind) ? 'false' : 'true'); invalidate(); } }, cv, el('span', null, def.name));
    erows.append(el('div', { class: 'lrow' }, b));
  }
  legend.append(erows, el('h2', null, 'Which fatal failure a node guards'));
  const fat = el('div', { class: 'fatals' });
  for (const [f, name] of [['1', 'Fatal one: a person sees a value'], ['2', 'Fatal two: an act the user did not want']]) {
    const b = el('button', { type: 'button', 'aria-pressed': String(fatalFilter === f), onclick: () => { fatalFilter = fatalFilter === f ? null : f; for (const [k, bb] of Object.entries(btnFatal)) bb.setAttribute('aria-pressed', String(fatalFilter === k)); invalidate(); } }, name);
    btnFatal[f] = b; fat.append(b);
  }
  legend.append(fat, el('p', { class: 'alt-note' }, 'At rest only the wiring between components is drawn; hover or select for the rest. Selected: upstream in the accent, downstream in ink, sideways in magenta. The tag S4 on a box is the stage that builds it.'));
}
buildLegend();
const q = document.getElementById('q'), results = document.getElementById('results');
let resultIds = [], active = 0;
const KIND_RANK = ['comp', 'inv', 'vocab', 'flag', 'dr', 'stage', 'open', 'res'];
function search() {
  const s = q.value.trim().toLowerCase();
  results.replaceChildren(); resultIds = []; active = 0;
  if (!s) { results.hidden = true; return; }
  const hits = nodes.filter((n) => !hiddenKinds.has(n.kind) && (n.label.toLowerCase().includes(s) || n.id.includes(s))).sort((a, b) => KIND_RANK.indexOf(a.kind) - KIND_RANK.indexOf(b.kind) || b.deg - a.deg).slice(0, 14);
  for (const n of hits) { resultIds.push(n.id); results.append(el('button', { type: 'button', onclick: () => { select(n, { flyTo: true }); results.hidden = true; q.value = ''; } }, glyph(n.kind), el('span', null, n.kind === 'dr' ? `${n.id.toUpperCase()} ${n.label}` : n.label), el('span', { class: 'id' }, n.id))); }
  if (!hits.length) results.append(el('div', { class: 'empty' }, 'Nothing matches.'));
  results.hidden = false;
  markActive();
}
function markActive() { [...results.querySelectorAll('button')].forEach((b, i) => b.classList.toggle('active', i === active)); }
q.addEventListener('input', search);
q.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') { active = Math.min(resultIds.length - 1, active + 1); markActive(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { active = Math.max(0, active - 1); markActive(); e.preventDefault(); }
  else if (e.key === 'Enter' && resultIds[active]) { select(byId.get(resultIds[active]), { flyTo: true }); results.hidden = true; q.value = ''; }
  else if (e.key === 'Escape') { results.hidden = true; q.blur(); }
});
document.addEventListener('click', (e) => { if (!e.target.closest('.search')) results.hidden = true; });
const btnLabels = document.getElementById('btn-labels'), btnEdges = document.getElementById('btn-edges');
btnFocus.addEventListener('click', () => { focus = !focus; btnFocus.setAttribute('aria-pressed', String(focus)); invalidate(); });
btnLabels.addEventListener('click', () => { allLabels = !allLabels; btnLabels.setAttribute('aria-pressed', String(allLabels)); invalidate(); });
btnEdges.addEventListener('click', () => { allEdges = !allEdges; btnEdges.setAttribute('aria-pressed', String(allEdges)); invalidate(); });
document.getElementById('btn-fit').addEventListener('click', () => { userMoved = false; fit(); });
const btnLegend = document.getElementById('btn-legend');
btnLegend.addEventListener('click', () => { const open = legend.classList.toggle('open'); btnLegend.setAttribute('aria-pressed', String(open)); });

// ----------------------------------------------------------------- pointer, wheel, keys
let drag = null, hoveredBadge = null; const pointers = new Map(); let pinch = null;
function hit(x, y) {
  for (const bd of badges) if (bd.sr && visible(bd.t) && !hiddenKinds.has(bd.n.kind) && Math.hypot(bd.sx - x, bd.sy - y) < bd.sr + 4) return { node: bd.n, badge: bd };
  let best = null, bd = 1e9;
  for (const n of nodes) {
    if (!visible(n) || n.kind === 'open' || n.kind === 'res') continue;
    if (n.kind === 'comp') { if (Math.abs(n.sx - x) <= BOX.w * cam.z / 2 && Math.abs(n.sy - y) <= BOX.h * cam.z / 2) return { node: n, badge: null }; continue; }
    const r = Math.max(2.5, n.k.r * Math.min(1.5, Math.max(0.65, cam.z))) + 5;
    const d = Math.hypot(n.sx - x, n.sy - y);
    if (d < r && d < bd) { best = n; bd = d; }
  }
  return best ? { node: best, badge: null } : null;
}
const pos = (e) => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
canvas.addEventListener('pointerdown', (e) => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, pos(e));
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: cam.z }; drag = null; return; }
  const p = pos(e);
  drag = { x: p.x, y: p.y, moved: false };
  hintEl.hidden = true;
  canvas.classList.add('grabbing');
});
canvas.addEventListener('pointermove', (e) => {
  const p = pos(e);
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, p);
  if (pinch && pointers.size === 2) { const [a, b] = [...pointers.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); cam.z = Math.max(0.2, Math.min(3, pinch.z * d / Math.max(1, pinch.d))); userMoved = true; invalidate(); return; }
  if (drag) {
    const dx = p.x - drag.x, dy = p.y - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
    cam.x -= dx / cam.z; cam.y -= dy / cam.z;
    if (drag.moved) userMoved = true;
    drag.x = p.x; drag.y = p.y; invalidate(); return;
  }
  const h = hit(p.x, p.y);
  const node = h ? h.node : null, badge = h ? h.badge : null;
  if (node !== hovered || badge !== hoveredBadge) { hovered = node; hoveredBadge = badge; canvas.classList.toggle('pointing', !!node); canvas.title = node ? `${node.label} (${node.k.name})` : ''; invalidate(); }
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  canvas.classList.remove('grabbing');
  if (!drag) return;
  const p = pos(e);
  if (!drag.moved && e.type === 'pointerup') { const h = hit(p.x, p.y); select(h ? h.node : null); }
  drag = null;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('dblclick', (e) => { const p = pos(e); const h = hit(p.x, p.y); if (h) { const w = toWorld(p.x, p.y); cam.z = Math.min(3, Math.max(cam.z, 1.5)); cam.x = h.node.x; cam.y = h.node.y; userMoved = true; select(h.node); } });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
canvas.addEventListener('wheel', (e) => {
  e.preventDefault(); userMoved = true; hintEl.hidden = true;
  const p = pos(e); const before = toWorld(p.x, p.y);
  cam.z = Math.max(0.2, Math.min(3, cam.z * Math.exp(-e.deltaY * 0.0012)));
  const after = toWorld(p.x, p.y);
  cam.x += before.x - after.x; cam.y += before.y - after.y;
  invalidate();
}, { passive: false });
canvas.addEventListener('keydown', (e) => {
  const k = e.key, step = 60 / cam.z;
  if (k === 'ArrowLeft') cam.x -= step; else if (k === 'ArrowRight') cam.x += step; else if (k === 'ArrowUp') cam.y -= step; else if (k === 'ArrowDown') cam.y += step;
  else if (k === '+' || k === '=') cam.z = Math.min(3, cam.z * 1.15); else if (k === '-') cam.z = Math.max(0.2, cam.z / 1.15);
  else if (k === '0') { userMoved = false; fit(); return; }
  else if (k === 'l' || k === 'L') { btnLabels.click(); return; } else if (k === 'e' || k === 'E') { btnEdges.click(); return; } else if ((k === 'f' || k === 'F') && !btnFocus.disabled) { btnFocus.click(); return; }
  else if (k === 'Escape') { select(null); return; } else return;
  userMoved = true;
  e.preventDefault(); invalidate();
});
window.addEventListener('resize', () => { resize(); if (!userMoved) fit(); else invalidate(); });
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { buildLegend(); renderInspector(); invalidate(); });
new MutationObserver(() => { buildLegend(); renderInspector(); invalidate(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
document.fonts && document.fonts.ready.then(() => invalidate());

// ----------------------------------------------------------------- start: fit, then open the node the address names
resize();
fit();
const wanted = decodeURIComponent(location.hash.slice(1));
if (wanted && byId.has(wanted)) select(byId.get(wanted), { flyTo: true });
window.addEventListener('hashchange', () => { const id = decodeURIComponent(location.hash.slice(1)); if (id && byId.has(id) && byId.get(id) !== selected) select(byId.get(id), { flyTo: true }); });
})();
</script>
