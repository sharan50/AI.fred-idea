* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font: 14px/1.45 var(--sans); overflow: hidden; }

button:hover { border-color: var(--ink-soft); }
.back { margin-left: 12px; font-size: 12px; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; white-space: nowrap; }

.app { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); z-index: 3; }

.results { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; max-height: 320px; overflow: auto; z-index: 5; box-shadow: none; }
.results button { display: flex; width: 100%; gap: 8px; align-items: center; text-align: left; border: 0; border-radius: 0; background: transparent; padding: 7px 10px; }
.results button:hover, .results button.active { background: var(--paper-2); }
.results .id { font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin-left: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 7px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); font-size: 12.5px; }
.chip[aria-pressed="false"] { opacity: 0.45; }

.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
.tools { display: flex; gap: 6px; margin-left: auto; }

.stage-wrap { position: relative; overflow: hidden; }
canvas#stage { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
canvas#stage.grabbing { cursor: grabbing; }
canvas#stage.pointing { cursor: pointer; }
.glyph { width: 16px; height: 16px; flex: none; display: inline-block; vertical-align: middle; }

.legend { position: absolute; left: 16px; bottom: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; font-size: 12.5px; max-width: 250px; z-index: 2; }

.ibody { overflow: auto; padding: 4px 0 12px; }
.grp { padding: 8px 12px 2px; }

.rows { display: grid; gap: 1px; }

.note { padding: 6px 12px 0; font-size: 12.5px; color: var(--ink-soft); }
.actions { display: flex; gap: 6px; padding: 10px 12px 0; }
.empty { padding: 4px 12px; color: var(--muted); font-size: 12.5px; }

@media (max-width: 720px) {
