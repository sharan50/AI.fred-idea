<title>AI.fred Dependency Map</title>
<!--__FONTS__-->
<style>
/* Tokens. Light is the publication's own paper and ink; dark is the same dossier at night. The seven category
   hues are the validated categorical order, stepped per surface; the accent is reserved for selection. */
:root {
  color-scheme: light;
  --paper: #fbfaf7; --paper-2: #f3f1ea; --ink: #17150e; --ink-soft: #4f4b40; --muted: #8a8578; --line: #d8d4c8;
  --accent: #a8321a; --panel: rgba(251, 250, 247, 0.94); --pill: rgba(251, 250, 247, 0.88);
  --node-stroke: rgba(23, 21, 14, 0.55); --edge: 23, 21, 14; --guide: rgba(23, 21, 14, 0.14);
  --c-found: #eb6834; --c-dr: #2a78d6; --c-comp: #1baf7a; --c-list: #eda100; --c-open: #e87ba4; --c-inv: #008300; --c-stage: #4a3aa7;
  --up: #a8321a; --down: #17150e; --lat: #b0407a;
  --sans: "Inter", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #15140f; --paper-2: #1f1d17; --ink: #f1eee6; --ink-soft: #b8b2a4; --muted: #7f7a6d; --line: #3a3730;
    --accent: #e86a4c; --panel: rgba(21, 20, 15, 0.92); --pill: rgba(21, 20, 15, 0.86);
    --node-stroke: rgba(241, 238, 230, 0.35); --edge: 241, 238, 230; --guide: rgba(241, 238, 230, 0.14);
    --c-found: #d95926; --c-dr: #3987e5; --c-comp: #199e70; --c-list: #c98500; --c-open: #d55181; --c-inv: #008300; --c-stage: #9085e9;
    --up: #e86a4c; --down: #f1eee6; --lat: #d55181;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #15140f; --paper-2: #1f1d17; --ink: #f1eee6; --ink-soft: #b8b2a4; --muted: #7f7a6d; --line: #3a3730;
  --accent: #e86a4c; --panel: rgba(21, 20, 15, 0.92); --pill: rgba(21, 20, 15, 0.86);
  --node-stroke: rgba(241, 238, 230, 0.35); --edge: 241, 238, 230; --guide: rgba(241, 238, 230, 0.14);
  --c-found: #d95926; --c-dr: #3987e5; --c-comp: #199e70; --c-list: #c98500; --c-open: #d55181; --c-inv: #008300; --c-stage: #9085e9;
  --up: #e86a4c; --down: #f1eee6; --lat: #d55181;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font: 14px/1.45 var(--sans); overflow: hidden; }
button, input { font: inherit; color: inherit; }
button { background: var(--paper-2); border: 1px solid var(--line); border-radius: 4px; padding: 5px 10px; cursor: pointer; }
button:hover { border-color: var(--ink-soft); }
.back { margin-left: 12px; font-size: 12px; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; white-space: nowrap; }
.back:hover { color: var(--ink); }
button:focus-visible, input:focus-visible, .row:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button:disabled { opacity: 0.45; cursor: default; }

.app { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); z-index: 3; }
.brand { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
.brand .mark { font-weight: 600; font-size: 16px; letter-spacing: 0.01em; }
.brand .sub { color: var(--ink-soft); font-size: 12.5px; }
.search { position: relative; flex: 1 1 220px; max-width: 360px; }
.search input { width: 100%; padding: 6px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--paper); }
.results { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; max-height: 320px; overflow: auto; z-index: 5; box-shadow: none; }
.results button { display: flex; width: 100%; gap: 8px; align-items: center; text-align: left; border: 0; border-radius: 0; background: transparent; padding: 7px 10px; }
.results button:hover, .results button.active { background: var(--paper-2); }
.results .id { font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin-left: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 7px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); font-size: 12.5px; }
.chip[aria-pressed="false"] { opacity: 0.45; }
.chip[aria-pressed="true"] { background: var(--paper); color: var(--ink); border-color: var(--line); }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
.tools { display: flex; gap: 6px; margin-left: auto; }

.stage-wrap { position: relative; overflow: hidden; }
canvas#stage { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
canvas#stage.grabbing { cursor: grabbing; }
canvas#stage.pointing { cursor: pointer; }
.glyph { width: 16px; height: 16px; flex: none; display: inline-block; vertical-align: middle; }

.legend { position: absolute; left: 16px; bottom: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; font-size: 12.5px; max-width: 250px; z-index: 2; }
.legend h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 6px; font-weight: 500; }
.legend h2 + .lrows + h2 { margin-top: 10px; }
.lrows { display: grid; gap: 3px; }
.lrow { display: flex; align-items: center; gap: 8px; }
.lrow canvas { width: 16px; height: 16px; flex: none; cursor: default; }
.lrow button { border: 0; background: transparent; color: var(--ink); padding: 0; text-align: left; display: flex; align-items: center; gap: 8px; }
.lrow button[aria-pressed="false"] { opacity: 0.4; text-decoration: line-through; }
.lrow .k { color: var(--ink-soft); }
.alt-note { color: var(--muted); font-size: 11.5px; margin: 6px 0 0; }
.hint { position: absolute; right: 16px; bottom: 16px; margin: 0; color: var(--muted); font-size: 12px; max-width: 340px; text-align: right; z-index: 2; }

.inspector { position: absolute; top: 12px; right: 12px; bottom: 12px; width: 340px; max-width: calc(100% - 24px); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; display: flex; flex-direction: column; z-index: 4; overflow: hidden; }
.inspector[hidden] { display: none; }
.ihead { display: flex; align-items: flex-start; gap: 8px; padding: 12px 12px 8px; border-bottom: 1px solid var(--line); }

.ihead h2 { font-size: 16px; line-height: 1.3; margin: 4px 0 2px; font-weight: 600; text-wrap: balance; }
.ihead .id { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.ihead .close { margin-left: auto; padding: 2px 8px; }
.facets { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.facets span { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); border: 1px solid var(--line); border-radius: 3px; padding: 1px 5px; }
.trail { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 12px; }
.trail:empty { display: none; }
.trail button { padding: 1px 7px; font-size: 12px; border-radius: 999px; }
.trail button.here { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.ibody { overflow: auto; padding: 4px 0 12px; }
.grp { padding: 8px 12px 2px; }
.grp h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 4px; font-weight: 500; display: flex; align-items: baseline; gap: 8px; }
.grp h3 .n { font-family: var(--mono); letter-spacing: 0; color: var(--ink-soft); }
.grp h3 .dir { display: inline-block; width: 10px; height: 3px; border-radius: 2px; }
.rows { display: grid; gap: 1px; }
.row { display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent; padding: 5px 4px; border-radius: 4px; }
.row:hover { background: var(--paper-2); }
.row .lbl { line-height: 1.3; }
.row .via { font-family: var(--mono); font-size: 10.5px; color: var(--muted); white-space: nowrap; }
.row canvas { width: 14px; height: 14px; cursor: pointer; }
.reopens { padding: 8px 12px; margin: 0 12px; background: var(--paper-2); border-radius: 4px; font-size: 12.5px; }
.reopens b { font-weight: 600; }
.reopens ul { margin: 4px 0 0; padding-left: 16px; }
.reopens li { margin: 1px 0; }
.reopens .id { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.loci { list-style: none; padding: 0 12px; margin: 0; font-family: var(--mono); font-size: 11px; color: var(--ink-soft); display: grid; gap: 3px; }
.loci .role { display: inline-block; width: 62px; color: var(--muted); }
.note { padding: 6px 12px 0; font-size: 12.5px; color: var(--ink-soft); }
.actions { display: flex; gap: 6px; padding: 10px 12px 0; }
.empty { padding: 4px 12px; color: var(--muted); font-size: 12.5px; }

@media (max-width: 720px) {
  .bar { gap: 8px 12px; }
  .brand .sub { display: none; }
  .tools { margin-left: 0; }
  .inspector { top: auto; left: 12px; right: 12px; bottom: 12px; width: auto; max-width: none; max-height: 48vh; }
  .legend { bottom: auto; top: 12px; max-width: 200px; font-size: 11.5px; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<script id="graph" type="application/json">/*__GRAPH__*/</script>
<script>
(() => {
'use strict';
const DATA = JSON.parse(document.getElementById('graph').textContent);

// ----------------------------------------------------------------- vocabulary of the drawing
// Altitude is causal depth. Upstream kinds sit higher: the fatal failures at the top, the harness in the middle,
// the open items at the floor. The bands follow the map's edge directions: a record justifies a list or an
// invariant, a component depends on both, a stage depends on components, an open item lands somewhere below.
const KIND = {
  fatal:   { g: 'found', shape: 'diamond',  r: 9,   band: 150, name: 'fatal failure' },
  premise: { g: 'found', shape: 'diamond',  r: 7,   band: 128, name: 'thesis premise' },
  ledger:  { g: 'found', shape: 'diamond',  r: 3.5, band: 100, name: 'ledger item' },
  dr:      { g: 'dr',    shape: 'circle',   r: 7.5, band: 66,  name: 'decision record' },
  alt:     { g: 'dr',    shape: 'hollow',   r: 2.5, band: 56,  name: 'rejected alternative' },
  inv:     { g: 'inv',   shape: 'triangle', r: 5,   band: 34,  name: 'invariant' },
  vocab:   { g: 'list',  shape: 'hexagon',  r: 5.5, band: 22,  name: 'closed list' },
  flag:    { g: 'list',  shape: 'hexagon',  r: 4,   band: 14,  name: 'policy flag row' },
  comp:    { g: 'comp',  shape: 'square',   r: 6,   band: -16, name: 'component' },
  stage:   { g: 'stage', shape: 'pentagon', r: 6,   band: -52, name: 'roadmap stage' },
  open:    { g: 'open',  shape: 'ring',     r: 4.5, band: -86, name: 'open item' },
  obj:     { g: 'open',  shape: 'ring',     r: 4,   band: -86, name: 'objection' },
  res:     { g: 'open',  shape: 'ring',     r: 4.5, band: -96, name: 'residual finding' },
};
const GROUP = {
  found: { tok: '--c-found', name: 'Why: the fatal failures, the premises, the ledger', kinds: ['fatal', 'premise', 'ledger'] },
  dr:    { tok: '--c-dr',    name: 'Decision records, and the alternatives they rejected', kinds: ['dr', 'alt'] },
  inv:   { tok: '--c-inv',   name: 'Invariants a record closes off', kinds: ['inv'] },
  list:  { tok: '--c-list',  name: 'Closed lists and policy flag rows', kinds: ['vocab', 'flag'] },
  comp:  { tok: '--c-comp',  name: 'Components of the harness', kinds: ['comp'] },
  stage: { tok: '--c-stage', name: 'Roadmap stages', kinds: ['stage'] },
  open:  { tok: '--c-open',  name: 'Open items, objections, residual findings', kinds: ['open', 'obj', 'res'] },
};
const BANDS = [[150, 'fatal failures'], [128, 'premises'], [100, 'the ledger'], [66, 'decision records'], [24, 'invariants and closed lists'], [-16, 'the harness'], [-52, 'stages'], [-90, 'open items and residuals']];
const EDGE = {
  'justifies':      { dir: 'down', dash: [],     w: 1.1, name: 'justifies (from is upstream)' },
  'depends-on':     { dir: 'up',   dash: [],     w: 0.8, name: 'depends on (to is upstream)' },
  'closes-off':     { dir: 'down', dash: [4, 3], w: 1.0, name: 'closes off (a record forbids)' },
  'rejects':        { dir: 'lat',  dash: [1, 3], w: 0.9, name: 'rejects (an alternative)' },
  'conflicts-with': { dir: 'lat',  dash: [6, 3], w: 1.2, name: 'conflicts with (a residual)' },
  'lands-in':       { dir: 'lat',  dash: [2, 3], w: 0.9, name: 'lands in (an open item)' },
};
const HUB_DEPTH = 2;

// ----------------------------------------------------------------- data
const nodes = DATA.nodes.map((n) => ({ ...n, k: KIND[n.kind] || KIND.comp, x: 0, y: 0, z: 0, deg: 0, sx: 0, sy: 0, s: 1, depth: 0 }));
const byId = new Map(nodes.map((n) => [n.id, n]));
const edges = DATA.edges.filter((e) => byId.has(e[0]) && byId.has(e[2])).map(([a, kind, b]) => ({ a: byId.get(a), b: byId.get(b), kind, e: EDGE[kind] || EDGE.justifies }));
const upOf = new Map(), downOf = new Map(), latOf = new Map();
const push = (m, k, v) => { if (!m.has(k)) m.set(k, []); m.get(k).push(v); };
for (const ed of edges) {
  ed.a.deg++; ed.b.deg++;
  if (ed.e.dir === 'down') { push(downOf, ed.a.id, { n: ed.b, ed }); push(upOf, ed.b.id, { n: ed.a, ed }); }
  else if (ed.e.dir === 'up') { push(upOf, ed.a.id, { n: ed.b, ed }); push(downOf, ed.b.id, { n: ed.a, ed }); }
  else { push(latOf, ed.a.id, { n: ed.b, ed }); push(latOf, ed.b.id, { n: ed.a, ed }); }
}
document.getElementById('sub').textContent = `Dependency map, edition ${DATA.edition}: ${nodes.length} nodes, ${edges.length} edges`;

// ----------------------------------------------------------------- layout: a seeded force layout in x and z, altitude by band
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { let a = seed; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
for (const n of nodes) {
  const r = rng(hash(n.id));
  const ang = r() * Math.PI * 2, rad = 40 + r() * 90;
  n.x = Math.cos(ang) * rad; n.z = Math.sin(ang) * rad; n.y = n.k.band + (r() - 0.5) * 3;
}
const K = 19;
let temp = 11;
const disp = new Float64Array(nodes.length * 2);
nodes.forEach((n, i) => { n.i = i; });
function step() {
  disp.fill(0);
  for (let i = 0; i < nodes.length; i++) {
    const a = nodes[i];
    for (let j = i + 1; j < nodes.length; j++) {
      const b = nodes[j];
      let dx = a.x - b.x, dz = a.z - b.z;
      const d2 = dx * dx + dz * dz + 0.01, d = Math.sqrt(d2);
      const same = Math.abs(a.y - b.y) < 20;
      let f = (K * K) / d2 * (same ? 1 : 0.35);
      if (same && d < 10) f += 2 / d; // no two glyphs on one shelf closer than ten units once settled
      dx *= f; dz *= f;
      disp[i * 2] += dx; disp[i * 2 + 1] += dz; disp[j * 2] -= dx; disp[j * 2 + 1] -= dz;
    }
  }
  for (const ed of edges) {
    const a = ed.a, b = ed.b;
    const dx = a.x - b.x, dz = a.z - b.z;
    const d = Math.sqrt(dx * dx + dz * dz) + 0.01;
    const wgt = ed.e.dir === 'lat' ? (ed.kind === 'rejects' ? 0.9 : 0.35) : 0.7;
    const f = (d / K) * wgt;
    disp[a.i * 2] -= dx / d * f; disp[a.i * 2 + 1] -= dz / d * f;
    disp[b.i * 2] += dx / d * f; disp[b.i * 2 + 1] += dz / d * f;
  }
  for (const n of nodes) {
    let dx = disp[n.i * 2], dz = disp[n.i * 2 + 1];
    const len = Math.sqrt(dx * dx + dz * dz) + 0.001;
    const s = Math.min(len, temp) / len;
    n.x += dx * s - n.x * 0.004; n.z += dz * s - n.z * 0.004;
    n.y += (n.k.band - n.y) * 0.2;
  }
  temp = Math.max(0.4, temp * 0.965);
}
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let settleFrames = reduced ? 0 : 110;
for (let i = 0; i < (reduced ? 220 : 90); i++) step();

// ----------------------------------------------------------------- camera and projection
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const HOME = { yaw: -0.55, pitch: 0.42, dist: 520, tx: 0, ty: 27, tz: 0, ox: 0, oy: 0 };
const VIEWS = { overview: { pitch: 0.42 }, elevation: { pitch: 0.06 }, plan: { pitch: 1.3 } };
const cam = { ...HOME, f: 620 };
let W = 0, H = 0, dpr = 1;
function resize() {
  const r = canvas.parentElement.getBoundingClientRect();
  dpr = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(200, r.width); H = Math.max(200, r.height);
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  dirty = true;
}
function project(p) {
  const x = p.x - cam.tx, y = p.y - cam.ty, z = p.z - cam.tz;
  const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
  const x1 = x * cy - z * sy, z1 = x * sy + z * cy;
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const y2 = y * cp - z1 * sp, z2 = y * sp + z1 * cp;
  const depth = cam.dist + z2;
  const s = cam.f / Math.max(40, depth);
  return { sx: W / 2 + x1 * s + cam.ox + shiftX, sy: H / 2 - y2 * s + cam.oy, s, depth };
}
// The scene sits centred in the space the legend and the inspector leave free.
let shiftX = 0;
// Fit the camera distance so the visible cloud fills the free part of the viewport; three refinements of the
// projection are enough because size falls off almost linearly with distance at this range.
function fitCamera(animate) {
  const vis = nodes.filter(visible);
  if (!vis.length) return;
  const to = { tx: 0, ty: HOME.ty, tz: 0, dist: cam.dist };
  const saved = { tx: cam.tx, ty: cam.ty, tz: cam.tz, dist: cam.dist, ox: cam.ox, oy: cam.oy };
  const freeW = W - (W > 900 ? 270 : 0) - (selected && W > 900 ? 360 : 0) - 48, freeH = H - (W > 900 ? 40 : 200);
  for (let it = 0; it < 3; it++) {
    Object.assign(cam, to, { ox: 0, oy: 0 });
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    for (const n of vis) { const p = project(n); x0 = Math.min(x0, p.sx); x1 = Math.max(x1, p.sx); y0 = Math.min(y0, p.sy); y1 = Math.max(y1, p.sy); }
    const scale = Math.max((x1 - x0 + 120) / (freeW * 0.92), (y1 - y0 + 60) / (freeH * 0.9));
    to.dist = Math.max(120, Math.min(1400, to.dist * scale));
  }
  Object.assign(cam, saved);
  if (!animate || reduced) { Object.assign(cam, to, { ox: 0, oy: 0 }); invalidate(); return; }
  fly = { t0: performance.now(), ms: 520, from: { ...saved, yaw: cam.yaw, pitch: cam.pitch }, to };
  kick();
}
function preset(name) {
  const v = VIEWS[name] || VIEWS.overview;
