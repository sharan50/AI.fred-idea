<style>
/* Tokens. The same two palettes as the record's map, so the two views read as one instrument. The category hues
   are shared with it too: a record is blue, an invariant green, a list amber, a component teal, a stage violet,
   an open item pink; the accent is reserved for selection. */

  --c-dr: #2a78d6; --c-comp: #1baf7a; --c-list: #eda100; --c-open: #e87ba4; --c-inv: #008300; --c-stage: #4a3aa7;
  --up: #a8321a; --down: #17150e; --lat: #b0407a;
  --sans: "Inter", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #15140f; --paper-2: #1f1d17; --ink: #f1eee6; --ink-soft: #b8b2a4; --muted: #7f7a6d; --line: #3a3730;
    --accent: #e86a4c; --panel: rgba(21, 20, 15, 0.92); --pill: rgba(21, 20, 15, 0.88);
    --node-stroke: rgba(241, 238, 230, 0.35); --edge: 241, 238, 230; --guide: rgba(241, 238, 230, 0.14); --zone: rgba(241, 238, 230, 0.035);
    --c-dr: #3987e5; --c-comp: #199e70; --c-list: #c98500; --c-open: #d55181; --c-inv: #3fa04a; --c-stage: #9085e9;
    --up: #e86a4c; --down: #f1eee6; --lat: #d55181;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #15140f; --paper-2: #1f1d17; --ink: #f1eee6; --ink-soft: #b8b2a4; --muted: #7f7a6d; --line: #3a3730;
  --accent: #e86a4c; --panel: rgba(21, 20, 15, 0.92); --pill: rgba(21, 20, 15, 0.88);

<script id="graph" type="application/json">/*__GRAPH__*/</script>
<script>
(() => {
'use strict';
const DATA = JSON.parse(document.getElementById('graph').textContent);

// ----------------------------------------------------------------- vocabulary of the drawing
// This view is the harness alone: the components of the component map (02, Figure 2.1), placed in its zones;
// above them the records that justify them, the invariants they must keep and the closed lists they read;
// below them the eight build stages. Open items and residual findings ride as badges on the node they land in.
const KIND = {
  dr:    { g: 'dr',    shape: 'circle',   r: 7,   name: 'decision record' },
  inv:   { g: 'inv',   shape: 'triangle', r: 5.5, name: 'invariant' },
  vocab: { g: 'list',  shape: 'hexagon',  r: 5.5, name: 'closed list' },
  flag:  { g: 'list',  shape: 'hexagon',  r: 4.5, name: 'policy flag row' },
  comp:  { g: 'comp',  shape: 'box',      r: 6,   name: 'component' },
  stage: { g: 'stage', shape: 'pentagon', r: 8,   name: 'roadmap stage' },
  open:  { g: 'open',  shape: 'ring',     r: 4,   name: 'open item' },
  res:   { g: 'open',  shape: 'ring',     r: 4,   name: 'residual finding' },
};
const GROUP = {
  dr:    { tok: '--c-dr',    name: 'Why: the records that justify the harness', kinds: ['dr'] },
  inv:   { tok: '--c-inv',   name: 'What must always hold: the invariants', kinds: ['inv'] },
  list:  { tok: '--c-list',  name: 'What the harness reads: closed lists and policy flag rows', kinds: ['vocab', 'flag'] },
  comp:  { tok: '--c-comp',  name: 'The components, in the zones of Figure 2.1', kinds: ['comp'] },
  stage: { tok: '--c-stage', name: 'Build order: the eight gated stages', kinds: ['stage'] },
  open:  { tok: '--c-open',  name: 'Open items and residual findings that land here', kinds: ['open', 'res'] },
};
const EDGE = {
  'justifies':      { dir: 'down', dash: [],     w: 1.0, arrow: 'to',   name: 'justifies (a record gives the reason)' },
  'depends-on':     { dir: 'up',   dash: [],     w: 1.0, arrow: 'from', name: 'depends on (the arrow points at what depends)' },
  'closes-off':     { dir: 'down', dash: [4, 3], w: 1.0, arrow: 'to',   name: 'closes off (a record forbids)' },
  'conflicts-with': { dir: 'lat',  dash: [6, 3], w: 1.1, arrow: null,   name: 'conflicts with (a residual finding)' },
  'lands-in':       { dir: 'lat',  dash: [2, 3], w: 0.9, arrow: null,   name: 'lands in (an open item)' },
};
const ZONES = [
  { id: 'device',     name: "The user's device",                                   cols: 1 },
  { id: 'entry',      name: "The entry boundary: the vault's edge proxy, the provider's", cols: 2 },
  { id: 'alias',      name: 'The alias zone: aliases only, no vault SDK',          cols: 4 },
  { id: 'real-value', name: 'The real-value zone: one detokenise right',           cols: 3 },
  { id: 'market',     name: 'Per market: adapters, the legal pack, residency',     cols: 2 },
  { id: 'floor',      name: 'The floor: people and site',                          cols: 3 },
  { id: 'cross',      name: 'Cross-cutting',                                        cols: 1 },
];
// Names for the boxes; everything else is derived from the node's label by dropping the article and any subtitle.
const SHORT = {
  'comp-adapter-in': 'India adapter', 'comp-adapter-uk': 'UK adapter', 'comp-adapter-us': 'US adapter',
  'comp-adapters': 'Passport adapters', 'comp-ai-executor': 'ai executor', 'comp-channel-connector': 'Channel connector',
  'comp-device-surface': 'Device surface and bounce-back', 'comp-legal-pack': 'Legal pack', 'comp-policy-layer': 'Policy layer and flag table',
  'comp-site-controls': 'Site controls', 'comp-state-machine': 'Task state machine', 'comp-surface-controllers': 'Surface controllers and step runner',
  'comp-task-cards': 'Task cards and card generator', 'comp-threat-model': 'Threat model', 'comp-tiers': 'Workforce tiers',
  'comp-watchdog': 'Timers, nudges, watchdog', 'comp-workflow-library': 'Workflow library', 'comp-vault': 'Tokenisation vault (bought)',
};
const HUB_DEPTH = 2;
const BOX = { w: 150, h: 46 }, GAP = 16, PAD = 18, TITLE = 26, ZGAP = 40;

// ----------------------------------------------------------------- data
const nodes = DATA.nodes.map((n) => ({ ...n, facets: n.facets || {}, loci: n.loci || [], k: KIND[n.kind] || KIND.comp, x: 0, y: 0, deg: 0, sx: 0, sy: 0 }));
const byId = new Map(nodes.map((n) => [n.id, n]));
const edges = DATA.edges.filter((e) => byId.has(e[0]) && byId.has(e[2]) && EDGE[e[1]]).map(([a, kind, b]) => ({ a: byId.get(a), b: byId.get(b), kind, e: EDGE[kind] }));
const upOf = new Map(), downOf = new Map(), latOf = new Map(), allOf = new Map();
const push = (m, k, v) => { if (!m.has(k)) m.set(k, []); m.get(k).push(v); };
for (const ed of edges) {
  ed.a.deg++; ed.b.deg++;
  push(allOf, ed.a.id, { n: ed.b, ed }); push(allOf, ed.b.id, { n: ed.a, ed });
  if (ed.e.dir === 'down') { push(downOf, ed.a.id, { n: ed.b, ed }); push(upOf, ed.b.id, { n: ed.a, ed }); }
  else if (ed.e.dir === 'up') { push(upOf, ed.a.id, { n: ed.b, ed }); push(downOf, ed.b.id, { n: ed.a, ed }); }
  else { push(latOf, ed.a.id, { n: ed.b, ed }); push(latOf, ed.b.id, { n: ed.a, ed }); }
}
const count = (k) => nodes.filter((n) => n.kind === k).length;
document.getElementById('sub').textContent = `Architecture map, edition ${DATA.edition}: ${count('comp')} components, ${count('inv')} invariants, ${count('vocab') + count('flag')} lists and flag rows, ${count('dr')} records`;

// The stage that builds a component: the lowest-numbered stage that depends on it.
const stageNo = new Map();
for (const ed of edges) if (ed.kind === 'depends-on' && ed.a.kind === 'stage' && ed.b.kind === 'comp') {
  const n = Number(ed.a.id.split('-')[1]);
  if (!stageNo.has(ed.b.id) || n < stageNo.get(ed.b.id)) stageNo.set(ed.b.id, n);
}
function shortLabel(n) {
  if (SHORT[n.id]) return SHORT[n.id];
  let s = n.label.replace(/^The /, '').split(':')[0].trim();
  return s.charAt(0).toUpperCase() + s.slice(1);
}

// ----------------------------------------------------------------- layout: the zones of Figure 2.1, bands above and below
const zones = ZONES.map((z) => ({ ...z, comps: [] }));
const Z = Object.fromEntries(zones.map((z) => [z.id, z]));
for (const n of nodes) if (n.kind === 'comp') (Z[n.facets.zone] || Z.cross).comps.push(n);
for (const z of zones) {
  z.comps.sort((a, b) => (stageNo.get(a.id) ?? 99) - (stageNo.get(b.id) ?? 99) || a.label.localeCompare(b.label));
  z.cols = Math.max(1, Math.min(z.cols, z.comps.length));
  z.rows = Math.max(1, Math.ceil(z.comps.length / z.cols));
  z.w = z.cols * BOX.w + (z.cols - 1) * GAP + 2 * PAD;
  z.h = z.rows * BOX.h + (z.rows - 1) * GAP + TITLE + 2 * PAD;
}
const X0 = Z.device.w + ZGAP;
Z.entry.x = X0; Z.entry.y = 0; Z.entry.w = Z.alias.w + ZGAP + Z['real-value'].w;
Z.alias.x = X0; Z.alias.y = Z.entry.h + ZGAP;
Z['real-value'].x = Z.alias.x + Z.alias.w + ZGAP; Z['real-value'].y = Z.alias.y;
Z.market.x = Z['real-value'].x + Z['real-value'].w + ZGAP; Z.market.y = Z.alias.y;
const rowBottom = Math.max(Z.alias.y + Z.alias.h, Z['real-value'].y + Z['real-value'].h, Z.market.y + Z.market.h);
Z.floor.x = X0; Z.floor.y = rowBottom + ZGAP;
Z.cross.x = Z.floor.x + Z.floor.w + ZGAP; Z.cross.y = Z.floor.y;
Z.device.x = 0; Z.device.y = Z.alias.y + Math.max(0, (Z.alias.h - Z.device.h) / 2);
const fieldLeft = 0, fieldRight = Z.market.x + Z.market.w, fieldTop = 0;
const fieldBottom = Math.max(Z.floor.y + (Z.floor.comps.length ? Z.floor.h : 0), Z.cross.y + (Z.cross.comps.length ? Z.cross.h : 0), rowBottom);
function slot(z, i) {
  const gridW = z.cols * BOX.w + (z.cols - 1) * GAP;
  const left = z.x + (z.w - gridW) / 2;
  const col = i % z.cols, row = Math.floor(i / z.cols);
  return { x: left + col * (BOX.w + GAP) + BOX.w / 2, y: z.y + TITLE + PAD + row * (BOX.h + GAP) + BOX.h / 2 };
}
function placeZone(z) { z.comps.forEach((n, i) => { const p = slot(z, i); n.x = p.x; n.y = p.y; }); }
for (const z of zones) placeZone(z);
// Two sweeps of a barycentre sort inside each zone, column-major by the mean x of a component's wired neighbours,
// so the wiring between zones runs as straight as a grid allows. Ties keep the build order.
const compNeighbours = (n) => (allOf.get(n.id) || []).filter((x) => x.ed.kind === 'depends-on' && x.n.kind === 'comp').map((x) => x.n);
for (let sweep = 0; sweep < 2; sweep++) for (const z of zones) {
  if (z.comps.length < 3) continue;
  const key = new Map();
  for (const n of z.comps) { const xs = compNeighbours(n).filter((m) => (Z[m.facets.zone] || Z.cross) !== z).map((m) => m.x); key.set(n.id, xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : n.x); }
  const order = [...z.comps].sort((a, b) => key.get(a.id) - key.get(b.id) || (stageNo.get(a.id) ?? 99) - (stageNo.get(b.id) ?? 99) || a.label.localeCompare(b.label));
  // column-major: the leftmost neighbours fill the left column top to bottom
